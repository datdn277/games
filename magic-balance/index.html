<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4effc">
    <meta name="description" content="Cân thử những bạn thú 3D và giải câu đố cùng gấu Mimo. Trò chơi tư duy toán học cho bé 5–6 tuổi.">
    <title>Chiếc cân thần kỳ · Little Math Detective</title>
  </head>
  <body>
    <div class="shell" id="app">
      <header class="topbar">
        <button class="brand" type="button" data-action="home" aria-label="Về trang chính của Chiếc cân thần kỳ">
          <span class="brand-mark" data-icon="scale"></span>
          <span>Phòng cân của Mimo</span>
        </button>
        <div class="top-tools">
          <span class="total" id="total" hidden></span>
          <span class="stars" id="stars"></span>
          <button class="icon-button" type="button" data-action="pause" id="pause" hidden></button>
          <button class="icon-button" type="button" data-action="sound" id="sound"></button>
        </div>
      </header>
      <main>
        <section class="menu" id="menu" aria-labelledby="title">
          <div class="menu-copy">
            <p class="kicker"><span data-icon="sparkle"></span> Thám tử toán học nhí</p>
            <h1 id="title" tabindex="-1">Chiếc cân <em>thần kỳ</em></h1>
            <p class="menu-description">Cùng Mimo cân thử các bạn thú, tìm cách làm cân thăng bằng và giải những câu đố trong khu rừng.</p>
            <div class="menu-actions">
              <button class="button primary" data-action="start" type="button"><span data-icon="play"></span> Bắt đầu</button>
              <button class="button soft" data-action="levels" type="button"><span data-icon="grid"></span> Chọn cấp độ</button>
            </div>
            <a class="collection" id="collection" href="../../index.html" hidden><span data-icon="back"></span> Kho trò chơi</a>
          </div>
          <div class="menu-stage" id="menu-stage">
            <div class="lab-frame" id="lab-frame">
              <canvas id="lab" aria-hidden="true"></canvas>
              <p class="webgl-note" id="webgl-note" hidden>Thiết bị này chưa hiển thị được phòng cân 3D.</p>
              <div class="pan-targets" id="pan-targets" hidden>
                <button class="pan-target" data-action="plate" data-side="left" type="button" aria-label="Đĩa cân trái"></button>
                <button class="pan-target" data-action="plate" data-side="right" type="button" aria-label="Đĩa cân phải"></button>
              </div>
              <div class="fallback-board" id="fallback-board" hidden></div>
            </div>
          </div>
        </section>
        <section class="levels" id="levels" aria-labelledby="levels-title" hidden>
          <button class="link-button" type="button" data-action="home"><span data-icon="back"></span> Quay lại</button>
          <h1 id="levels-title" tabindex="-1">Chọn cấp độ</h1>
          <div class="level-grid" id="level-grid"></div>
        </section>
        <section class="game" id="game" aria-labelledby="question-title" hidden>
          <div class="question-card">
            <div class="question-icon" id="question-icon" aria-hidden="true"></div>
            <div class="question-copy">
              <p class="level-name" id="level-name"></p>
              <h1 id="question-title" tabindex="-1"></h1>
            </div>
            <div class="round-progress" role="img" id="round-progress"></div>
          </div>
          <div class="evidence" id="evidence" hidden></div>
          <div class="station">
            <div class="game-stage" id="game-stage"></div>
            <div class="pan-controls" id="pan-controls"></div>
          </div>
          <div class="workbench">
            <div class="task" id="task"></div>
            <div class="tray" id="tray" hidden></div>
            <div class="tools" id="tools" hidden>
              <button class="button tool-button" type="button" data-action="listen"><span data-icon="volume"></span> Nghe lại</button>
              <button class="button tool-button" type="button" data-action="hint"><span data-icon="bulb"></span> Gợi ý</button>
              <button class="button tool-button" type="button" data-action="reset"><span data-icon="reset"></span> Làm lại</button>
            </div>
          </div>
          <div id="speech-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
